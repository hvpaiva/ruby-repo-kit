name: Bug report
description: Report reproducible unexpected behavior
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command, expected result, and actual result. Remove credentials and private data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the CLI version, Ruby version, operating system, and installation method.
    validations:
      required: true
